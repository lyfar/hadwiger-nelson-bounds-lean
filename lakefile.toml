name = "hadwiger-nelson-bounds-lean"
version = "0.1.0"
keywords = ["mathematics", "graph-theory", "lean"]
defaultTargets = ["HadwigerNelsonBounds"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "HadwigerNelsonBounds"
